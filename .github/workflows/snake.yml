name: Snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#8b5cf6&color_dots=#ebedf0,#ddd6fe,#a78bfa,#8b5cf6,#6d28d9
            dist/snake-dark.svg?palette=github-dark&color_snake=#38bdf8&color_dots=#161622,#3b2a6b,#5b3fb0,#8b5cf6,#c4b5fd&color_background=#0f0f1a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
