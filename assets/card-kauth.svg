<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190" role="img" aria-label="KAuth — Local auth testing sandbox — play with flows without a backend.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#f472b6" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="100%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity=".35"/><stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="400" height="190" rx="16"/></clipPath>
  </defs>
  <style>
    .shine { animation: sweep 5s ease-in-out 3.0s infinite; }
    @keyframes sweep { 0% { transform: translateX(-400px); } 45%,100% { transform: translateX(400px); } }
    .dot { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="400" height="190" fill="#0f0f1a"/>
    <rect width="400" height="190" fill="url(#glow)"/>
    <rect class="shine" width="400" height="190" fill="url(#shine)"/>
    <text x="24" y="50" font-family="'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="-.5" fill="#f4f4fb">KAuth</text>
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="1">
      <rect x="285" y="30" width="91" height="24" rx="12" fill="#f472b6" fill-opacity=".14"/>
      <circle class="" cx="299" cy="42" r="3.5" fill="#f472b6"/>
      <text x="364" y="46" text-anchor="end" fill="#f472b6">SHIPPED</text>
    </g>
    <text x="24" y="86" font-family="'Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" fill="#9a9ab5"><tspan x="24" dy="0">Local auth testing sandbox — play with flows</tspan><tspan x="24" dy="20">without a backend.</tspan></text>
    <g font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" fill="#f4f4fb" fill-opacity=".85"><g transform="translate(24,140)"><rect width="94" height="24" rx="6" fill="#1d1d2e"/><text x="47" y="16.5" text-anchor="middle">TypeScript</text></g><g transform="translate(126,140)"><rect width="50" height="24" rx="6" fill="#1d1d2e"/><text x="25" y="16.5" text-anchor="middle">Auth</text></g><g transform="translate(184,140)"><rect width="79" height="24" rx="6" fill="#1d1d2e"/><text x="40" y="16.5" text-anchor="middle">Security</text></g></g>
    <rect x=".5" y=".5" width="399" height="189" rx="16" fill="none" stroke="url(#edge)"/>
  </g>
</svg>
