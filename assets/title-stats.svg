<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="Activity">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="brandMove" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#8b5cf6"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#8b5cf6;#38bdf8;#f472b6;#8b5cf6"/></stop>
      <stop offset="100%" stop-color="#38bdf8"><animate attributeName="stop-color" dur="8s" repeatCount="indefinite" values="#38bdf8;#f472b6;#8b5cf6;#38bdf8"/></stop>
    </linearGradient></defs>
  <style>
    .bar { animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; transform-origin: 0 0; transform: scaleX(0); }
    .run { animation: run 3.5s linear infinite; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes run { from { transform: translateX(0); } to { transform: translateX(900px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .bar { transform: none; } }
  </style>
  <text x="0" y="26" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" letter-spacing="3" fill="url(#brand)">ACTIVITY</text>
  <rect class="bar" x="133" y="19" width="1067" height="1" fill="#2a2a40"/>
  <rect class="run" x="133" y="18" width="60" height="3" rx="1.5" fill="url(#brand)"/>
</svg>
